<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Coach ginnastica{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body>
    <header class="site-header">
      <nav aria-label="Navigazione principale">
        <a href="{{ url_for('main.today') }}" {% if request.endpoint in ('main.today', 'main.immediate_feedback', 'main.next_morning_feedback') %}aria-current="page"{% endif %}>Oggi</a>
        <a href="/history" {% if request.endpoint == 'main.history' %}aria-current="page"{% endif %}>Storico</a>
        <a href="{{ url_for('main.coach_state') }}" {% if request.endpoint == 'main.coach_state' %}aria-current="page"{% endif %}>Coach</a>
        <a href="/import" {% if request.endpoint and request.endpoint.startswith('main.import') %}aria-current="page"{% endif %}>Importa</a>
      </nav>
    </header>
    <main>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <section class="flash-messages" aria-live="polite">
            {% for message in messages %}<p>{{ message }}</p>{% endfor %}
          </section>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
