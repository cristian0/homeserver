- id: boiler_giorno_schedule_on
  alias: Boiler giorno - accensione schedule
  description: >
    Accende la presa del boiler giorno in due finestre fisse (mattina e sera),
    dimensionate sul warm-up di un tank 80L @ 45°C partendo da ~30°C. Sostituisce
    il vecchio mirror 1:1 sul boiler notte. Ad ogni accensione imposta anche il
    countdown hardware della Tapo a 120 min come safety net: se HA non riesce a
    comandare lo spegnimento, la presa si autospegne da sola.
  triggers:
  - trigger: time
    at: '05:30:00'
    id: mattina
  - trigger: time
    at: '18:00:00'
    id: sera
  conditions: []
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.boiler_giorno
  - action: number.set_value
    target:
      entity_id: number.boiler_giorno_turn_off_in
    data:
      value: 120
  mode: single
- id: boiler_giorno_schedule_off
  alias: Boiler giorno - spegnimento schedule
  description: >
    Spegne la presa all'inizio della finestra d'uso (07:00 e 19:30). Così al
    primo prelievo il tank è caldo e si raffredda durante l'uso invece di
    perdere calore in standby.
  triggers:
  - trigger: time
    at: '07:00:00'
  - trigger: time
    at: '19:30:00'
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.boiler_giorno
  mode: single
- id: modalita_via_mirror_boiler_giorno
  alias: Modalità via - mirror boiler giorno
  description: 'Durante il pre-heat il boiler giorno (presa senza setpoint) segue il boiler notte: ON
    mentre notte scalda, OFF quando smette. Abilitata solo nella finestra di pre-heat.'
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.ariston_is_heating_2
    to: 'on'
    id: heating_on
  - trigger: state
    entity_id: binary_sensor.ariston_is_heating_2
    to: 'off'
    id: heating_off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: heating_on
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.boiler_giorno
      - action: number.set_value
        target:
          entity_id: number.boiler_giorno_turn_off_in
        data:
          value: 120
    default:
    - action: switch.turn_off
      target:
        entity_id: switch.boiler_giorno
- id: modalita_via_gestione
  alias: Modalità via - gestione
  description: 'All''accensione di input_boolean.modalita_via: backup modo boiler, snapshot, spegne il
    boiler della casa principale, tapparelle al 50%, sospende le automazioni giornaliere. Allo spegnimento:
    ripristina stato esatto (tapparelle/switch via scena, modo boiler via set_operation_mode) e riattiva
    tutto. Non tocca alcuna entità bilo.'
  mode: single
  triggers:
  - trigger: state
    entity_id: input_boolean.modalita_via
    to: 'on'
    id: attiva
  - trigger: state
    entity_id: input_boolean.modalita_via
    to: 'off'
    id: ripristina
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: attiva
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.modalita_via_boiler_mode
        data:
          value: '{{ states(''water_heater.boiler_notte'') }}'
      - action: scene.create
        data:
          scene_id: snapshot_via_boiler
          snapshot_entities:
          - water_heater.boiler_notte
          - switch.ariston_power_2
          - switch.ariston_eco_mode_2
          - switch.boiler_giorno
      - action: scene.create
        data:
          scene_id: snapshot_via_tapparelle
          snapshot_entities:
          - cover.cucina_tapp_finestra
          - cover.cucina_tapp_finestra_2
          - cover.cucina_tapp_portafinestra
          - cover.notte_tapp_terrazzo_tapp_terrazzo
          - cover.shellyshutter_48f6ee8ed8bc
          - cover.shellyshutter_48f6ee8f065c
          - cover.soggiorno_tapp_portafinestra_destra
          - cover.tapparella_giacomo
          - cover.tapparella_scala
      - action: water_heater.turn_off
        target:
          entity_id: water_heater.boiler_notte
      - action: switch.turn_off
        target:
          entity_id:
          - switch.ariston_power_2
          - switch.boiler_giorno
      - action: cover.set_cover_position
        target:
          entity_id:
          - cover.cucina_tapp_finestra
          - cover.cucina_tapp_finestra_2
          - cover.cucina_tapp_portafinestra
          - cover.notte_tapp_terrazzo_tapp_terrazzo
          - cover.shellyshutter_48f6ee8ed8bc
          - cover.shellyshutter_48f6ee8f065c
          - cover.soggiorno_tapp_portafinestra_destra
          - cover.tapparella_giacomo
          - cover.tapparella_scala
        data:
          position: 50
      - action: automation.turn_off
        target:
          entity_id:
          - automation.buongiorno
          - automation.boiler_giorno_accensione_schedule
          - automation.boiler_giorno_spegnimento_schedule
          - automation.modalita_via_mirror_boiler_giorno
      - action: notify.mobile_app_iphone_cristiano
        data:
          title: 🏠 Modalità via attivata
          message: Boiler spento, tapparelle al 50%, automazioni giornaliere sospese. Imposta la data
            di rientro per il pre-riscaldamento.
    - conditions:
      - condition: trigger
        id: ripristina
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.modalita_via_mirror_boiler_giorno
      - action: scene.turn_on
        continue_on_error: true
        target:
          entity_id:
          - scene.snapshot_via_tapparelle
          - scene.snapshot_via_boiler
      - if:
        - condition: template
          value_template: '{{ states(''input_text.modalita_via_boiler_mode'') in [''MANUAL'',''PROGRAM'',''BOOST'']
            }}'
        then:
        - action: water_heater.set_operation_mode
          target:
            entity_id: water_heater.boiler_notte
          data:
            operation_mode: '{{ states(''input_text.modalita_via_boiler_mode'') }}'
      - action: automation.turn_on
        target:
          entity_id:
          - automation.buongiorno
          - automation.boiler_giorno_accensione_schedule
          - automation.boiler_giorno_spegnimento_schedule
      - action: notify.mobile_app_iphone_cristiano
        data:
          title: 🏠 Modalità via disattivata
          message: Casa ripristinata allo stato precedente.
- id: modalita_via_preheat
  alias: Modalità via - pre-heat
  description: A (rientro - anticipo ore) riaccende il boiler notte in MANUAL per portarlo a temperatura,
    e abilita il mirror del boiler giorno. Niente BOOST. Solo casa principale.
  mode: single
  triggers:
  - trigger: template
    value_template: '{% set ts = state_attr(''input_datetime.rientro'', ''timestamp'') | float(0) %}{%
      set anticipo = states(''input_number.anticipo_riscaldamento_ore'') | float(4) %}{{ ts > 0 and now().timestamp()
      >= (ts - anticipo * 3600) }}'
  conditions:
  - condition: state
    entity_id: input_boolean.modalita_via
    state: 'on'
  - condition: state
    entity_id: switch.ariston_power_2
    state: 'off'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.ariston_power_2
  - action: water_heater.set_operation_mode
    target:
      entity_id: water_heater.boiler_notte
    data:
      operation_mode: MANUAL
  - action: automation.turn_on
    target:
      entity_id: automation.modalita_via_mirror_boiler_giorno
  - action: notify.mobile_app_iphone_cristiano
    data:
      title: ♨️ Pre-riscaldamento rientro
      message: Boiler notte in riscaldamento per il tuo rientro.
- id: modalita_via_rientro
  alias: Modalità via - rientro programmato
  description: All'orario di input_datetime.rientro spegne la modalità via, innescando il ripristino completo
    (gestito da 'Modalità via - gestione').
  mode: single
  triggers:
  - trigger: time
    at: input_datetime.rientro
  conditions:
  - condition: state
    entity_id: input_boolean.modalita_via
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.modalita_via

